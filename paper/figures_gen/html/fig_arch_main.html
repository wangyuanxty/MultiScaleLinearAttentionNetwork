<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600, initial-scale=1">
<title>DeltaCycle Architecture</title>
<style>
@page { size: 1600px 900px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  background: #F3F5F7;
  color: #1F262B;
  width: 1600px;
  height: 900px;
  overflow: hidden;
}

.container {
  width: 100%; height: 100%;
  padding: 10px 16px;
  display: flex; flex-direction: column; gap: 8px;
}

.main {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: 400px 1fr 400px; gap: 8px;
}

/* ---------- left: window -> tokens ---------- */
.patch-panel {
  background: #FFFFFF; border: 1px solid #C9D1D8; border-radius: 6px;
  display: flex; flex-direction: column; min-height: 0;
}
.patch-head {
  flex: 0 0 26px;
  font-size: 12px; font-weight: bold; letter-spacing: 1px; text-align: center;
  background: #DCE8F3; border-bottom: 1px solid #A8BDD1;
  display: flex; align-items: center; justify-content: center;
}
.tl-wrap { flex: 0 0 160px; padding: 6px 8px 2px; }
.tl-wrap img { width: 100%; height: 100%; object-fit: contain; }
.patch-chart { flex: 1; min-height: 0; padding: 2px 8px 8px; }
.patch-chart img { width: 100%; height: 100%; object-fit: contain; }

/* ---------- center: AI arch + parameter ring ---------- */
.ai-panel {
  background: #FFFFFF; border: 1px solid #C9D1D8; border-radius: 6px;
  display: flex; flex-direction: column; min-height: 0;
}
.panel-head {
  flex: 0 0 26px;
  font-size: 12px; font-weight: bold; letter-spacing: 1px; text-align: center;
  display: flex; align-items: center; justify-content: center;
  border-bottom: 1px solid #E3D9BD; background: #F6EED8;
}
.ai-body { flex: 1; min-height: 0; padding: 6px 8px 2px; }
.ai-body img { width: 100%; height: 100%; object-fit: contain; }
.spec-panel { flex: 0 0 430px; padding: 4px 8px 8px; }
.spec-panel img { width: 100%; height: 100%; object-fit: contain; }

/* ---------- right: exchange zoom + params ---------- */
.sqx-panel {
  background: #FFFFFF; border: 1px solid #C9D1D8; border-radius: 6px;
  display: flex; flex-direction: column; min-height: 0;
}
.sqx-head {
  flex: 0 0 26px;
  font-size: 12px; font-weight: bold; letter-spacing: 1px; text-align: center;
  display: flex; align-items: center; justify-content: center;
  border-bottom: 1px solid #C4D4BC; background: #E4EDDD;
}
.sqx-body { flex: 1; min-height: 0; padding: 4px 8px 2px; }
.sqx-body img { width: 100%; height: 100%; object-fit: contain; }
.sqx-note {
  flex: 0 0 76px; border-top: 1px solid #EEF1F4;
  padding: 8px 10px; font-size: 10.5px; color: #6B7680; line-height: 1.5;
}
.sqx-note .f {
  font-family: Georgia, serif; font-size: 13px; color: #1F262B;
  display: block; margin: 3px 0 1px;
}
.sqx-params { flex: 0 0 300px; padding: 4px 8px 8px; }
.sqx-params img { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>

<div class="container">
  <div class="main">

    <!-- left -->
    <div class="patch-panel">
      <div class="patch-head">FROM WINDOW TO TOKENS</div>
      <div class="tl-wrap"><img src="../patch_timeline.png" alt="timeline"></div>
      <div class="patch-chart">
        <img src="../charts/arch_window_pool.svg" alt="window and patch bands">
      </div>
    </div>

    <!-- center -->
    <div class="ai-panel">
      <div class="panel-head">MULTI-SCALE GDN-2 ENCODER · THREE BRANCHES · TWO LAYERS EACH</div>
      <div class="ai-body">
        <img src="../ms_arch.png" alt="architecture">
      </div>
      <div class="spec-panel">
        <img src="../spec_panel.png" alt="parameter ring">
      </div>
    </div>

    <!-- right -->
    <div class="sqx-panel">
      <div class="sqx-head">STAGE-QUERY CROSS-SCALE EXCHANGE · PER LAYER</div>
      <div class="sqx-body">
        <img src="../sqx_zoom.png" alt="stage-query zoom">
      </div>
      <div class="sqx-note">
        coarse state <b>S</b> → single query → sweeps fine k/v · O(L) · additive
        <span class="f">c<sub>f</sub> = Attn(q, K, V) · h<sub>f</sub> ← h<sub>f</sub> + c<sub>f</sub></span>
      </div>
      <div class="sqx-params">
        <img src="../sqx_params.png" alt="exchange parameters">
      </div>
    </div>

  </div>
</div>
</body>
</html>
